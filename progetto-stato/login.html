<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazzino Sepack — Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    .logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .logo img { height: 48px; }
    .logo h1 {
      font-size: 20px;
      color: #2c3e50;
      margin-top: 10px;
      font-weight: 700;
    }
    .logo p {
      font-size: 13px;
      color: #999;
      margin-top: 4px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #00B4CC; }
    .btn {
      width: 100%;
      padding: 13px;
      background: #00B4CC;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 24px;
      transition: background 0.2s;
    }
    .btn:hover { background: #009ab0; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .error {
      background: #ffeaea;
      color: #e74c3c;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 13px;
      margin-top: 14px;
      display: none;
    }
    .spinner {
      display: inline-block;
      width: 16px; height: 16px;
      border: 2px solid white;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">
      <img src="/images/sepack.png" alt="Sepack" onerror="this.style.display='none'">
      <h1>Magazzino</h1>
      <p>Inserisci le tue credenziali</p>
    </div>
    <form onsubmit="event.preventDefault(); handleLogin();">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="email@esempio.com" autocomplete="email">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <button class="btn" id="loginBtn" type="submit">Accedi</button>
      <a href="/?readonly=1" id="readonlyBtn" style="display:block; text-align:center; margin-top:14px; color:#999; font-size:13px; text-decoration:none; padding:8px;">
        👁 Accedi in sola lettura
      </a>
    </form>
    <div class="error" id="errorMsg"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://wonuzdqupujzeqhucxok.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvbnV6ZHF1cHVqemVxaHVjeG9rIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgxNzYzMjQsImV4cCI6MjA3Mzc1MjMyNH0.UVNF-cb7W9nynV327q4Qz8-vdDk6_6IKbwrvFwVA2Mw';
    const { createClient } = supabase;
    const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Se già loggato vai direttamente all'app
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session) window.location.href = '/';
    });

    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('errorMsg');

      if (!email || !password) {
        showError('Inserisci email e password.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Accesso...';
      err.style.display = 'none';

      const { data, error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        showError('Credenziali non valide. Riprova.');
        btn.disabled = false;
        btn.textContent = 'Accedi';
        return;
      }

      // Login ok — vai all'app
      window.location.href = '/';
    }

    function showError(msg) {
      const err = document.getElementById('errorMsg');
      err.textContent = msg;
      err.style.display = 'block';
    }

    // Enter per fare login
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') handleLogin();
    });
  </script>
</body>
</html>
